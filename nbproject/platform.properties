# Apache NetBeans Platform release this suite builds against.
# The platform is a build dependency, not a checked-in binary: nbproject/platform.xml
# downloads it from the official Apache NetBeans distribution the first time a build
# needs it. Bump this one value to move to a newer release.
netbeans.version=31

# Where the downloaded platform is unpacked. Keyed by version so bumping
# netbeans.version fetches a fresh copy rather than mixing clusters. Git-ignored.
#
# Suite-component modules read this same file, and there ${basedir} is the module
# directory, not the suite. They do set suite.dir first, so anchor on that; the
# suite.dir line below only takes effect when the suite itself loads this file.
suite.dir=${basedir}
nbplatform.active=default
nbplatform.default.netbeans.dest.dir=${suite.dir}/nbplatform/${netbeans.version}
nbplatform.default.harness.dir=${nbplatform.default.netbeans.dest.dir}/harness

# No nbjdk.home / platforms.*.home here on purpose: with neither set the harness
# builds with whichever JDK runs Ant, so JAVA_HOME alone selects the JDK.

branding.token=mysnow2026
cluster.path=\
    ${nbplatform.active.dir}/platform
disabled.modules=\
    org.netbeans.api.search,\
    org.netbeans.core.netigso,\
    org.netbeans.core.osgi,\
    org.netbeans.libs.felix,\
    org.netbeans.libs.osgi,\
    org.netbeans.libs.testng,\
    org.netbeans.modules.autoupdate.cli,\
    org.netbeans.modules.core.kit,\
    org.netbeans.modules.keyring.impl,\
    org.netbeans.modules.netbinox,\
    org.netbeans.modules.spi.actions
